<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive BRD Viewer</title><link rel="stylesheet" href="/viewer.css">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script defer src="/viewer.js"></script></head>
<body><header><div class="brand"><strong>Interactive BRD Viewer</strong><small>Universal Word task pane</small></div><span id="office-state" class="pill">Loading</span></header>
<main>
  <div class="controls"><label for="brd">Document / BRD</label><select id="brd" aria-label="BRD"><option value="">Select a BRD</option></select>
  <label for="illustration">Illustration</label><select id="illustration" aria-label="Illustration"><option value="">Select illustration</option></select>
  <div class="actions"><button id="bind" type="button">Associate with this Word document</button><button id="reload" type="button" class="secondary">Refresh</button></div>
  <label class="checkbox"><input type="checkbox" id="autoopen"> Open this viewer automatically with this document</label>
  <p class="hint" id="status" role="status" aria-live="polite">Loading catalog...</p></div>
  <div class="viewer-title"><strong id="diagram-title">No illustration selected</strong><span id="version"></span></div>
  <div id="empty" class="empty">Select a BRD to display its interactive illustration.</div>
  <iframe id="illustration-frame" title="BRD interactive illustration" hidden referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" loading="eager"></iframe>
</main><footer>Private test build • HTML is loaded from the same approved server</footer></body></html>
